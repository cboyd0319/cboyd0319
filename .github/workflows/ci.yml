name: CI

on:
  push:
    branches: [automation/update-signals-panel]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Set up npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Install pinned ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libfontconfig1-dev \
            libfreetype-dev \
            libpng-dev \
            librsvg2-dev \
            pkg-config \
            zlib1g-dev
          ./scripts/install-imagemagick-ci.sh

      - name: Validate generated profile image
        run: npm run validate
