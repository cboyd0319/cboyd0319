name: CI

on:
  push:
    branches: [automation/update-signals-panel]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Set up npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Install pinned ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libfontconfig1-dev \
            libfreetype-dev \
            libpng-dev \
            librsvg2-dev \
            pkg-config \
            zlib1g-dev
          ./scripts/install-imagemagick-ci.sh

      - name: Validate generated profile image
        run: npm run validate
