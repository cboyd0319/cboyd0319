name: Update profile README

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

concurrency:
  group: update-profile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Set up npm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install dependencies
        run: npm ci

      - name: Install pinned ImageMagick
        run: ./scripts/install-imagemagick-ci.sh

      - name: Generate signals panel
        run: npm run generate
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Optimize PNG
        run: npm run optimize-signals

      - name: Upload generated panel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signals-panel
          path: assets/signals.png
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: render
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download generated panel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signals-panel
          path: assets

      - name: Install pinned GitHub CLI
        run: |
          archive="${RUNNER_TEMP}/gh.tar.gz"
          curl -fsSL https://github.com/cli/cli/releases/download/v2.103.3/gh_2.103.3_linux_amd64.tar.gz -o "$archive"
          printf '%s  %s\n' 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "${RUNNER_TEMP}/gh_2.103.3_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Publish validated update if changed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PROFILE_UPDATE_TOKEN || github.token }}
          UPDATE_BRANCH: automation/update-signals-panel
        run: ./scripts/publish-signals.sh
