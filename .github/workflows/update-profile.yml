name: Update profile README

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * *"

concurrency:
  group: update-profile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Set up npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Generate signals panel
        run: npm run generate
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Optimize PNG
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y pngquant
          npm run optimize-signals

      - name: Upload generated panel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signals-panel
          path: assets/signals.png
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: render
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download generated panel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signals-panel
          path: assets

      - name: Create or update pull request if changed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PROFILE_UPDATE_TOKEN || github.token }}
          UPDATE_BRANCH: automation/update-signals-panel
        run: |
          set -euo pipefail

          if git diff --quiet -- assets/signals.png; then
            echo "No changes - skipping PR."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          git fetch origin "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" || true
          git checkout -B "$UPDATE_BRANCH"
          git add assets/signals.png
          git commit -m "Update signals panel"
          git push --force-with-lease origin "HEAD:$UPDATE_BRANCH"

          pr_url="$(gh pr list \
            --head "$UPDATE_BRANCH" \
            --base main \
            --state open \
            --json url \
            --jq '.[0].url')"

          if [ -z "$pr_url" ]; then
            if ! pr_url="$(gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "Update signals panel" \
              --body "Updates the generated profile signals panel." \
              2>pr-create.err)"; then
              echo "::notice title=Update branch ready::Pushed $UPDATE_BRANCH. Pull request creation is blocked by repository workflow permissions or missing PROFILE_UPDATE_TOKEN."
              sed 's/^/gh pr create: /' pr-create.err
              exit 0
            fi
          fi

          echo "Update PR: $pr_url"
