name: Update profile README

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

concurrency:
  group: update-profile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Set up npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Install pinned ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libfontconfig1-dev \
            libfreetype-dev \
            libpng-dev \
            librsvg2-dev \
            pkg-config \
            zlib1g-dev
          ./scripts/install-imagemagick-ci.sh

      - name: Generate signals panel
        run: npm run generate
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Optimize PNG
        run: npm run optimize-signals

      - name: Upload generated panel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signals-panel
          path: assets/signals.png
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: render
    permissions:
      actions: write
      checks: read
      contents: write
      statuses: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download generated panel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signals-panel
          path: assets

      - name: Publish validated update if changed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PROFILE_UPDATE_TOKEN || github.token }}
          UPDATE_BRANCH: automation/update-signals-panel
        run: |
          set -euo pipefail

          if git diff --quiet -- assets/signals.png; then
            echo "No changes - skipping PR."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          git fetch origin "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" || true
          git checkout -B "$UPDATE_BRANCH"
          git add assets/signals.png
          git commit -m "Update signals panel"
          commit_sha="$(git rev-parse HEAD)"
          git push --force-with-lease origin "HEAD:$UPDATE_BRANCH"

          check_started=0
          for attempt in {1..6}; do
            status="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${commit_sha}/check-runs?check_name=validate" \
              --jq '.check_runs[0].status // ""')"

            if [ -n "$status" ]; then
              check_started=1
              break
            fi

            sleep 5
          done

          if [ "$check_started" -eq 0 ]; then
            gh workflow run ci.yml --ref "$UPDATE_BRANCH"
          fi

          for attempt in {1..60}; do
            conclusion="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${commit_sha}/check-runs?check_name=validate" \
              --jq '.check_runs[0].conclusion // ""')"

            case "$conclusion" in
              success)
                check_url="$(gh api \
                  "repos/${GITHUB_REPOSITORY}/commits/${commit_sha}/check-runs?check_name=validate" \
                  --jq '.check_runs[0].html_url // ""')"
                gh api \
                  --method POST \
                  "repos/${GITHUB_REPOSITORY}/statuses/${commit_sha}" \
                  -f state=success \
                  -f context=validate \
                  -f description="CI validate passed for generated profile update" \
                  -f target_url="$check_url"
                git push origin "HEAD:main"
                echo "Updated main with validated signals panel: $commit_sha"
                exit 0
                ;;
              failure|cancelled|timed_out|action_required)
                echo "validate concluded $conclusion for $commit_sha"
                exit 1
                ;;
            esac

            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for validate on $commit_sha"
              exit 1
            fi

            sleep 5
          done
