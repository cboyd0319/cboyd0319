<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Live public feed</title>
  <desc id="desc">A cyberpunk SVG panel with latest public repository activity for Chad Boyd.</desc>
  <defs>
    <linearGradient id="feed-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="oklch(9% 0.07 285)"/>
      <stop offset="0.55" stop-color="oklch(14% 0.1 318)"/>
      <stop offset="1" stop-color="oklch(8% 0.05 275)"/>
    </linearGradient>
    <pattern id="feed-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="oklch(74% 0.21 205 / 0.1)" stroke-width="1"/>
    </pattern>
    <filter id="feed-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="430" fill="url(#feed-bg)"/>
  <rect width="1200" height="430" fill="url(#feed-grid)"/>
  <rect x="38" y="36" width="1124" height="358" fill="oklch(9% 0.04 280 / 0.7)" stroke="oklch(62% 0.29 350)" stroke-width="2"/>
  <path d="M70 96H1130" stroke="oklch(72% 0.24 205 / 0.42)" stroke-width="1"/>
  <path d="M70 394 104 360M1130 394 1096 360M70 36 104 70M1130 36 1096 70" stroke="oklch(72% 0.24 205)" stroke-width="2"/>

  <text x="72" y="78" fill="oklch(67% 0.28 25)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="900" letter-spacing="3">LIVE PUBLIC FEED</text>
  <text x="846" y="78" fill="oklch(79% 0.2 350)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="900" filter="url(#feed-glow)">AUTO-REFRESHED BY ACTIONS</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="86" y="154" fill="oklch(96% 0.02 290)" font-size="22" font-weight="900">WormsWMD-macOS-Fix</text>
    <text x="430" y="154" fill="oklch(86% 0.12 205)" font-size="18" font-weight="750">Shell / 42 stars / Apr 29, 2026</text>
    <text x="86" y="183" fill="oklch(79% 0.2 350)" font-size="17" font-weight="750">Tahoe repair kit for black screens and crash-prone sessions.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="86" y="216" fill="oklch(96% 0.02 290)" font-size="22" font-weight="900">JobSentinel</text>
    <text x="430" y="216" fill="oklch(86% 0.12 205)" font-size="18" font-weight="750">Rust / 9 stars / Apr 20, 2026</text>
    <text x="86" y="245" fill="oklch(79% 0.2 350)" font-size="17" font-weight="750">Private-by-default job radar: scrape, score, alert.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="86" y="278" fill="oklch(96% 0.02 290)" font-size="22" font-weight="900">PyGuard</text>
    <text x="430" y="278" fill="oklch(86% 0.12 205)" font-size="18" font-weight="750">Python / 1 star / Feb 3, 2026</text>
    <text x="86" y="307" fill="oklch(79% 0.2 350)" font-size="17" font-weight="750">Python static-analysis gate for security and code quality.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="86" y="340" fill="oklch(96% 0.02 290)" font-size="22" font-weight="900">PoshGuard</text>
    <text x="430" y="340" fill="oklch(86% 0.12 205)" font-size="18" font-weight="750">PowerShell / 2 stars / Nov 21, 2025</text>
    <text x="86" y="369" fill="oklch(79% 0.2 350)" font-size="17" font-weight="750">PowerShell analyzer and autofix rig with diffs and rollback.</text>
  </g>
</svg>
