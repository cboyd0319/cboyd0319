<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Tokyo neon profile sign wall</title>
  <desc id="desc">A quiet Tokyo neon sign wall for Chad Boyd with minimal copy and large dark space.</desc>
  <defs>
    <linearGradient id="c-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#050713"/>
      <stop offset="0.58" stop-color="#0b0d22"/>
      <stop offset="1" stop-color="#041216"/>
    </linearGradient>
    <radialGradient id="c-cyan" cx="28%" cy="64%" r="38%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#050713" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c-pink" cx="78%" cy="28%" r="36%">
      <stop offset="0" stop-color="#ff2f92" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#050713" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c-hot" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.52" stop-color="#ff2f92"/>
      <stop offset="1" stop-color="#ffe66d"/>
    </linearGradient>
    <filter id="c-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="500" fill="url(#c-bg)"/>
  <rect width="1200" height="500" fill="url(#c-cyan)"/>
  <rect width="1200" height="500" fill="url(#c-pink)"/>
  <path d="M72 72H1128V420H72Z" fill="#050916" fill-opacity="0.44" stroke="#7df9ff" stroke-opacity="0.2"/>
  <path d="M72 72H364" stroke="url(#c-hot)" stroke-width="2.2"/>
  <path d="M844 420H1128" stroke="url(#c-hot)" stroke-width="2.2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="850">
    <text x="96" y="120" fill="#ffe66d" font-size="15" letter-spacing="4">NIGHT OPERATOR</text>
  </g>

  <g font-family="Arial Black, Impact, ui-sans-serif, system-ui, sans-serif" font-weight="900">
    <text x="96" y="212" fill="#ff2f92" fill-opacity="0.58" font-size="62">CHAD BOYD</text>
    <text x="100" y="208" fill="#f4fbff" font-size="62" filter="url(#c-glow)">CHAD BOYD</text>
  </g>

  <g filter="url(#c-glow)">
    <path d="M720 126H1016L1048 158V246H720Z" fill="#07101a" fill-opacity="0.82" stroke="#ff2f92" stroke-width="2.4"/>
    <text x="760" y="176" fill="#ffe66d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="900" letter-spacing="3">LOCAL TOOLS</text>
    <text x="760" y="216" fill="#9df8ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="850">REPAIR / SECURITY / AGENTS</text>
  </g>

  <g opacity="0.7" filter="url(#c-glow)">
    <path d="M290 318H506L534 346V390H290Z" fill="#07101a" fill-opacity="0.82" stroke="#00e5ff" stroke-width="2"/>
    <circle cx="360" cy="354" r="24" fill="none" stroke="#ff2f92" stroke-width="3"/>
    <circle cx="444" cy="354" r="24" fill="none" stroke="#ffe66d" stroke-width="3"/>
    <path d="M360 354H444" stroke="#00e5ff" stroke-width="2.4"/>
  </g>

  <g opacity="0.58" stroke-linecap="round">
    <path d="M760 310H1080" stroke="#00e5ff" stroke-width="2.4" filter="url(#c-glow)"/>
    <path d="M720 354H1030" stroke="#ff2f92" stroke-width="2.4" filter="url(#c-glow)"/>
    <path d="M812 386H1100" stroke="#ffe66d" stroke-width="2.4" filter="url(#c-glow)"/>
  </g>
</svg>
