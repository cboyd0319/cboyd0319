<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Chad Boyd operator manifest</title>
  <desc id="desc">A cyberpunk operator manifest describing Chad Boyd's local-first development mode, public signal, tools, and grid rules.</desc>
  <defs>
    <linearGradient id="c-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#050713"/>
      <stop offset="0.52" stop-color="#10152a"/>
      <stop offset="1" stop-color="#061015"/>
    </linearGradient>
    <linearGradient id="c-card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0e1a2b" stop-opacity="0.93"/>
      <stop offset="1" stop-color="#120b24" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="c-hot" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.55" stop-color="#ff2f92"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <pattern id="c-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#7df9ff" stroke-opacity="0.08" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#7df9ff" fill-opacity="0.14"/>
    </pattern>
    <filter id="c-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="620" fill="url(#c-bg)"/>
  <rect width="1200" height="620" fill="url(#c-grid)"/>
  <path d="M64 102H1136M64 506H1136" stroke="url(#c-hot)" stroke-width="2.4" opacity="0.82"/>
  <path d="M118 102V506M406 102V506M794 102V506M1082 102V506" stroke="#ffffff" stroke-opacity="0.08"/>
  <path d="M64 102 96 70H1136M64 506 96 538H1136" fill="none" stroke="#00e5ff" stroke-opacity="0.58" stroke-width="1.6"/>

  <text x="64" y="66" fill="#ffd166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="900" letter-spacing="3">OPERATOR MANIFEST</text>
  <text x="818" y="66" fill="#7df9ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="900" letter-spacing="2">PROFILE CORE // PUBLIC VIEW</text>

  <g>
    <path d="M64 122H374L398 146V480H64Z" fill="url(#c-card)" stroke="#00e5ff" stroke-opacity="0.66" stroke-width="1.8"/>
    <path d="M94 164H242" stroke="#ff2f92" stroke-width="5" filter="url(#c-glow)"/>
    <text x="94" y="154" fill="#ffd166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="900" letter-spacing="2">IDENTITY</text>
    <circle cx="220" cy="258" r="86" fill="#07101d" stroke="#7df9ff" stroke-opacity="0.38" stroke-width="1.6"/>
    <circle cx="220" cy="258" r="58" fill="none" stroke="#ff2f92" stroke-opacity="0.62" stroke-width="2.4" filter="url(#c-glow)"/>
    <path d="M220 172V344M134 258H306M159 197 281 319M281 197 159 319" stroke="#7df9ff" stroke-opacity="0.22" stroke-width="1.2"/>
    <text x="220" y="250" text-anchor="middle" fill="#f7fbff" font-family="Arial Black, Impact, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="900">CB</text>
    <text x="220" y="282" text-anchor="middle" fill="#ff4fb3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="900">0319</text>
    <text x="94" y="382" fill="#f7fbff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="900">Chad Boyd</text>
    <text x="94" y="414" fill="#7df9ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="800">cboyd0319</text>
    <text x="94" y="446" fill="#ff4fb3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="800">local_first operator</text>
  </g>

  <g>
    <path d="M430 122H770L794 146V480H430Z" fill="url(#c-card)" stroke="#ff2f92" stroke-opacity="0.66" stroke-width="1.8"/>
    <text x="462" y="154" fill="#ffd166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="900" letter-spacing="2">SIGNAL</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="850">
      <path d="M462 196H512" stroke="#00e5ff" stroke-width="3" filter="url(#c-glow)"/>
      <text x="530" y="202" fill="#f7fbff">repeatable automation</text>
      <path d="M462 252H512" stroke="#ff2f92" stroke-width="3" filter="url(#c-glow)"/>
      <text x="530" y="258" fill="#f7fbff">security gates</text>
      <path d="M462 308H512" stroke="#ffd166" stroke-width="3" filter="url(#c-glow)"/>
      <text x="530" y="314" fill="#f7fbff">macOS repair and recovery</text>
      <path d="M462 364H512" stroke="#00e5ff" stroke-width="3" filter="url(#c-glow)"/>
      <text x="530" y="370" fill="#f7fbff">AI-assisted dev workflows</text>
    </g>
    <path d="M462 418H742" stroke="#ffffff" stroke-opacity="0.11"/>
    <text x="462" y="442" fill="#7df9ff" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650">Small tools. Plain logs.</text>
    <text x="462" y="466" fill="#7df9ff" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650">Rollback paths are explicit.</text>
  </g>

  <g>
    <path d="M826 122H1136V480H850L826 456Z" fill="url(#c-card)" stroke="#ffd166" stroke-opacity="0.62" stroke-width="1.8"/>
    <text x="858" y="154" fill="#ffd166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="900" letter-spacing="2">STACK</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="850">
      <text x="858" y="204" fill="#f7fbff">Python</text>
      <path d="M982 197H1094" stroke="#00e5ff" stroke-width="7" stroke-linecap="square"/>
      <text x="858" y="250" fill="#f7fbff">Rust</text>
      <path d="M982 243H1064" stroke="#ff2f92" stroke-width="7" stroke-linecap="square"/>
      <text x="858" y="296" fill="#f7fbff">Shell</text>
      <path d="M982 289H1080" stroke="#ffd166" stroke-width="7" stroke-linecap="square"/>
      <text x="858" y="342" fill="#f7fbff">PowerShell</text>
      <path d="M982 335H1050" stroke="#7df9ff" stroke-width="7" stroke-linecap="square"/>
      <text x="858" y="388" fill="#f7fbff">TypeScript</text>
      <path d="M982 381H1072" stroke="#ff4fb3" stroke-width="7" stroke-linecap="square"/>
    </g>
    <text x="858" y="433" fill="#ffd166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="900" letter-spacing="2">PRIVATE GRID</text>
    <text x="858" y="456" fill="#7df9ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="800">profiles / baselines / tools</text>
  </g>

  <g>
    <path d="M64 532H1136V586H64Z" fill="#070d18" fill-opacity="0.84" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="88" y="565" fill="#ffd166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="900" letter-spacing="2">GRID RULES</text>
    <text x="246" y="565" fill="#f7fbff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="850">LOCAL FIRST / PRIVATE BY DEFAULT / LOGS BEAT VIBES / ROLLBACK BEATS REGRET</text>
  </g>
</svg>
