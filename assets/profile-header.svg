      <path d="M24 42H74M24 78H58M24 114H82M24 150H64" stroke="#ff4fb3" stroke-width="8"/>
      <circle cx="52" cy="184" r="16" fill="none" stroke="#ffe66d" stroke-width="5"/>
    </g>
    <g transform="translate(914 182)">
      <path d="M0 0H72V126H0Z" fill="#06101a" fill-opacity="0.84" stroke="#00e5ff" stroke-width="2"/>
      <path d="M18 30H54M18 62H46M18 94H56" stroke="#7df9ff" stroke-width="7"/>
    </g>
    <g transform="translate(840 244)">
      <path d="M0 0H62V80H0Z" fill="#101008" fill-opacity="0.82" stroke="#ffe66d" stroke-width="2"/>
      <path d="M15 26H47M15 52H40" stroke="#ffe66d" stroke-width="6"/>
    </g>
  </g>

  <path d="M0 352H1200" stroke="url(#h-horizon)" stroke-width="2.6"/>
  <rect y="352" width="1200" height="168" fill="url(#h-road)"/>

  <g opacity="0.42" stroke-linecap="round">
    <path d="M600 352 170 520M600 352 380 520M600 352 600 520M600 352 820 520M600 352 1030 520" stroke="#7df9ff" stroke-width="1"/>
    <path d="M88 398H1112M178 438H1022M272 478H928" stroke="#ff2f92" stroke-width="1"/>
  </g>

