  <g fill="#02030a" opacity="0.78">
    <path d="M402 348a30 12 0 0 1 60 0H402Z"/>
    <path d="M430 348v44" stroke="#02030a" stroke-width="7" stroke-linecap="round"/>
    <path d="M756 354a26 11 0 0 1 52 0H756Z"/>
    <path d="M780 354v38" stroke="#02030a" stroke-width="7" stroke-linecap="round"/>
    <circle cx="512" cy="362" r="10"/>
    <path d="M512 372v42M496 394h32" stroke="#02030a" stroke-width="7" stroke-linecap="round"/>
    <circle cx="690" cy="366" r="9"/>
    <path d="M690 375v36M676 394h28" stroke="#02030a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g font-family="Arial Black, Impact, ui-sans-serif, system-ui, sans-serif" font-weight="900" letter-spacing="2">
    <text x="70" y="214" fill="#ff2f92" fill-opacity="0.72" font-size="92">CHAD BOYD</text>
    <text x="76" y="206" fill="#00e5ff" fill-opacity="0.62" font-size="92">CHAD BOYD</text>
    <text x="82" y="210" fill="url(#h-name)" font-size="92" filter="url(#h-glow)">CHAD BOYD</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="850">
    <path d="M84 244H486" stroke="url(#h-horizon)" stroke-width="2"/>
    <text x="86" y="274" fill="#7df9ff" font-size="16" letter-spacing="4">SECURITY AUTOMATION · CLOUD OPS</text>
