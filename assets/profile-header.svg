<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Chad Boyd neon synthwave profile header</title>
  <desc id="desc">A research-inspired neon synthwave header with a rainy Japanese city-canyon street, stacked glowing signs, umbrella silhouettes, wet crossing reflections, and bold profile typography.</desc>
  <defs>
    <linearGradient id="h-sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#02030a"/>
      <stop offset="0.45" stop-color="#080821"/>
      <stop offset="1" stop-color="#03050d"/>
    </linearGradient>
    <radialGradient id="h-sun" cx="50%" cy="45%" r="52%">
      <stop offset="0" stop-color="#ffe66d" stop-opacity="0.96"/>
      <stop offset="0.38" stop-color="#ff4fb3" stop-opacity="0.86"/>
      <stop offset="0.7" stop-color="#7b2cff" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#050713" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-cyan-bloom" cx="18%" cy="66%" r="48%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.34"/>
      <stop offset="0.58" stop-color="#00e5ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-pink-bloom" cx="84%" cy="50%" r="48%">
      <stop offset="0" stop-color="#ff2f92" stop-opacity="0.36"/>
      <stop offset="0.6" stop-color="#ff2f92" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ff2f92" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-horizon" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#00e5ff"/>
      <stop offset="0.52" stop-color="#ff2f92"/>
      <stop offset="0.84" stop-color="#ffe66d"/>
      <stop offset="1" stop-color="#ffe66d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-road" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#080917" stop-opacity="0.62"/>
      <stop offset="0.56" stop-color="#050713" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#010207"/>
    </linearGradient>
    <linearGradient id="h-left-face" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#02030a"/>
      <stop offset="1" stop-color="#0a0a1d"/>
    </linearGradient>
    <linearGradient id="h-right-face" x1="1" x2="0" y1="0" y2="0">
      <stop offset="0" stop-color="#02030a"/>
      <stop offset="1" stop-color="#0b071d"/>
    </linearGradient>
    <linearGradient id="h-reflection" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.24" stop-color="#00e5ff" stop-opacity="0.55"/>
      <stop offset="0.52" stop-color="#ff2f92" stop-opacity="0.68"/>
      <stop offset="0.78" stop-color="#ffe66d" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#ffe66d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-name" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="0.5" stop-color="#e7fdff"/>
      <stop offset="1" stop-color="#fff0a6"/>
    </linearGradient>
    <filter id="h-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="h-soft-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="h-sun-clip">
      <circle cx="600" cy="198" r="128"/>
    </clipPath>
  </defs>

  <rect width="1200" height="520" fill="url(#h-sky)"/>
  <rect width="1200" height="520" fill="url(#h-cyan-bloom)"/>
  <rect width="1200" height="520" fill="url(#h-pink-bloom)"/>

  <g opacity="0.2" stroke="#7df9ff" stroke-width="1" stroke-linecap="round">
    <path d="M92 38l-14 84M184 86l-11 62M374 24l-12 86M818 58l-12 82M1012 36l-16 102M1112 88l-10 72"/>
    <path d="M36 214l-8 58M260 226l-10 66M910 206l-9 64M1160 194l-8 62"/>
  </g>

  <g filter="url(#h-soft-glow)">
    <circle cx="600" cy="198" r="128" fill="url(#h-sun)"/>
    <g clip-path="url(#h-sun-clip)" stroke="#050713" stroke-opacity="0.72" stroke-width="8">
      <path d="M472 146H728M472 174H728M472 202H728M472 230H728M472 258H728M472 286H728"/>
    </g>
  </g>

