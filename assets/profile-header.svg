      <stop offset="0.44" stop-color="#ff7adf"/>
      <stop offset="0.72" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#f4fbff"/>
    </linearGradient>
    <filter id="h-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="h-soft-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
