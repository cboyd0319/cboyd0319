    <path d="M0 298H54V238H104V298H154V212H204V298H252V176H314V298H360V238H414V298H468V222H520V298H568V258H632V298H684V204H744V298H792V166H858V298H908V230H958V298H1002V198H1068V298H1200" fill="none" stroke="#00e5ff" stroke-opacity="0.2"/>
  </g>

