<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Chad Boyd Tokyo neon synthwave profile header</title>
  <desc id="desc">A Tokyo neon synthwave profile header with wet street reflections, sparse rain, vertical signs, and glowing night typography.</desc>
  <defs>
    <linearGradient id="h-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#040611"/>
      <stop offset="0.48" stop-color="#090b1d"/>
      <stop offset="1" stop-color="#041214"/>
    </linearGradient>
    <radialGradient id="h-pink-bloom" cx="78%" cy="44%" r="46%">
      <stop offset="0" stop-color="#ff2f92" stop-opacity="0.42"/>
      <stop offset="0.46" stop-color="#ff2f92" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#040611" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-cyan-bloom" cx="18%" cy="76%" r="40%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#040611" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-hot" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#00e5ff"/>
      <stop offset="0.58" stop-color="#ff2f92"/>
      <stop offset="1" stop-color="#ffe66d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-road" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#070817" stop-opacity="0"/>
      <stop offset="0.58" stop-color="#050713" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#03050b"/>
    </linearGradient>
    <linearGradient id="h-reflect" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.34" stop-color="#00e5ff" stop-opacity="0.34"/>
      <stop offset="0.64" stop-color="#ff2f92" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffe66d" stop-opacity="0"/>
    </linearGradient>
    <filter id="h-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="url(#h-bg)"/>
  <rect width="1200" height="520" fill="url(#h-pink-bloom)"/>
  <rect width="1200" height="520" fill="url(#h-cyan-bloom)"/>

  <g opacity="0.18" stroke="#9df8ff" stroke-width="1.1" stroke-linecap="round">
    <path d="M148 20 132 102M312 60 296 152M532 18 516 110M718 70 702 160M1038 24 1024 120M1126 82 1112 164"/>
    <path d="M88 184 78 238M442 198 430 276M816 174 804 246M994 196 982 270"/>
  </g>

  <g opacity="0.52">
    <path d="M0 284H80V208H128V284H214V176H274V284H368V236H430V284H502V192H562V284H636V224H700V284H792V158H864V284H930V214H986V284H1200V348H0Z" fill="#03050d"/>
    <path d="M0 284H80V208H128V284H214V176H274V284H368V236H430V284H502V192H562V284H636V224H700V284H792V158H864V284H930V214H986V284H1200" fill="none" stroke="#00e5ff" stroke-opacity="0.2"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="900" filter="url(#h-glow)">
    <path d="M906 80H1034L1054 102V276H906Z" fill="#070d18" fill-opacity="0.84" stroke="#ff2f92" stroke-width="2"/>
    <text x="938" y="130" fill="#ffe66d" font-size="18" letter-spacing="4">TOKYO</text>
    <text x="936" y="178" fill="#f4fbff" font-size="20" letter-spacing="2">NEON</text>
    <path d="M1080 134H1142V260H1080Z" fill="#07101a" fill-opacity="0.78" stroke="#00e5ff" stroke-width="2"/>
    <text x="1111" y="188" text-anchor="middle" fill="#ff4fb3" font-size="14" letter-spacing="2">LOCAL</text>
  </g>

  <path d="M0 348H1200" stroke="url(#h-hot)" stroke-width="2.2"/>
  <rect y="348" width="1200" height="172" fill="url(#h-road)"/>
  <g opacity="0.42" stroke-linecap="round">
    <path d="M600 348 218 520M600 348 420 520M600 348 600 520M600 348 780 520M600 348 982 520" stroke="#00e5ff" stroke-width="1"/>
    <path d="M156 416H1044M246 468H954" stroke="#ff2f92" stroke-width="1"/>
    <path d="M128 392H394M470 438H736M812 404H1088M260 494H524M676 486H1014" stroke="url(#h-reflect)" stroke-width="5" opacity="0.56"/>
  </g>

  <g font-family="Arial Black, Impact, ui-sans-serif, system-ui, sans-serif" font-weight="900">
    <text x="74" y="210" fill="#ff2f92" fill-opacity="0.72" font-size="88">CHAD BOYD</text>
    <text x="79" y="205" fill="#f4fbff" font-size="88" filter="url(#h-glow)">CHAD BOYD</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="850">
    <text x="82" y="266" fill="#7df9ff" font-size="17" letter-spacing="4">SHINJUKU NIGHT BUILD</text>
  </g>
</svg>
