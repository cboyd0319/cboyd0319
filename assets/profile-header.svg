    <text x="76" y="260" fill="#c9fbff" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">Local-first systems for terminals, agents, and repair work.</text>
