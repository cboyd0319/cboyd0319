    <path d="M1200 76H968L872 352H1200Z" fill="url(#h-right-face)"/>
    <path d="M244 92 328 352M968 76 872 352" stroke="#7df9ff" stroke-opacity="0.13"/>
  </g>

  <g filter="url(#h-glow)" opacity="0.94" stroke-linecap="round">
    <g transform="translate(44 112)">
      <path d="M0 0H68V174H0Z" fill="#07101a" fill-opacity="0.86" stroke="#00e5ff" stroke-width="2"/>
      <path d="M16 28H52M16 58H42M16 88H56M16 118H38M16 148H50" stroke="#7df9ff" stroke-width="7"/>
    </g>
    <g transform="translate(132 168)">
      <path d="M0 0H102V118H0Z" fill="#0d0717" fill-opacity="0.84" stroke="#ff2f92" stroke-width="2"/>
      <path d="M20 28H82M20 58H66M20 88H88" stroke="#ff4fb3" stroke-width="8"/>
    </g>
    <g transform="translate(250 206)">
      <path d="M0 0H70V108H0Z" fill="#100a12" fill-opacity="0.82" stroke="#ffe66d" stroke-width="2"/>
      <circle cx="34" cy="32" r="14" fill="none" stroke="#ffe66d" stroke-width="5"/>
      <path d="M18 66H54M18 88H46" stroke="#ffe66d" stroke-width="6"/>
    </g>
    <g transform="translate(1040 104)">
