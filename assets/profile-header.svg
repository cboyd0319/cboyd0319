    <path d="M328 424H872L940 452H260Z" fill="#f4fbff" fill-opacity="0.12"/>
    <path d="M198 474H1002L1094 510H106Z" fill="#f4fbff" fill-opacity="0.1"/>
  </g>

  <g opacity="0.56" stroke-linecap="round">
    <path d="M98 390H354M432 430H758M832 402H1104M210 494H528M656 484H1038" stroke="url(#h-reflection)" stroke-width="6"/>
    <path d="M126 452H316M470 476H682M778 450H990" stroke="#00e5ff" stroke-width="3" opacity="0.64"/>
    <path d="M68 416H236M934 430H1140" stroke="#ff2f92" stroke-width="4" opacity="0.58"/>
