      <stop offset="0.58" stop-color="#050713" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#010207"/>
    </linearGradient>
    <linearGradient id="h-hot" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#00e5ff"/>
      <stop offset="0.52" stop-color="#ff2f92"/>
      <stop offset="0.84" stop-color="#ffe66d"/>
      <stop offset="1" stop-color="#ffe66d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-reflection" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00e5ff" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#ff2f92" stop-opacity="0.72"/>
      <stop offset="0.82" stop-color="#ffe66d" stop-opacity="0.48"/>
