<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">CBOYD0319 Tokyo neon synthwave profile header</title>
  <desc id="desc">A Tokyo neon synthwave GitHub profile header with a striped sunset, skyline, tower, wet road reflections, retro car, and glowing CBOYD0319 typography.</desc>
  <defs>
    <linearGradient id="h-sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#02030a"/>
      <stop offset="0.48" stop-color="#090821"/>
      <stop offset="1" stop-color="#03050d"/>
    </linearGradient>
    <radialGradient id="h-sun" cx="50%" cy="43%" r="54%">
      <stop offset="0" stop-color="#ffe66d"/>
      <stop offset="0.38" stop-color="#ff5bb6"/>
      <stop offset="0.72" stop-color="#7c36ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#050713" stop-opacity="0"/>
