<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Chad Boyd synthwave cyberpunk profile header</title>
  <desc id="desc">A synthwave and cyberpunk profile header for Chad Boyd with a neon city, striped sunset, VHS scanlines, rain, palms, and a glowing horizon grid.</desc>
  <defs>
    <linearGradient id="h-sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#040411"/>
      <stop offset="0.36" stop-color="#16062f"/>
      <stop offset="0.68" stop-color="#30113e"/>
      <stop offset="1" stop-color="#05070e"/>
    </linearGradient>
    <radialGradient id="h-afterglow" cx="73%" cy="34%" r="48%">
      <stop offset="0" stop-color="#ff3eb5" stop-opacity="0.58"/>
      <stop offset="0.42" stop-color="#ff8a3d" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#05070e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-sun" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe66d"/>
      <stop offset="0.5" stop-color="#ff7a32"/>
      <stop offset="1" stop-color="#ff2f92"/>
    </linearGradient>
    <linearGradient id="h-neon" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#ff2f92"/>
      <stop offset="0.8" stop-color="#ffe66d"/>
      <stop offset="1" stop-color="#ffe66d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-road" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#09051a" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#03040a" stop-opacity="0.98"/>
    </linearGradient>
    <pattern id="h-scan" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 1H10" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="h-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="h-sun-cut">
      <circle cx="870" cy="178" r="132"/>
    </clipPath>
  </defs>

  <rect width="1200" height="520" fill="url(#h-sky)"/>
  <rect width="1200" height="520" fill="url(#h-afterglow)"/>
  <rect width="1200" height="520" fill="url(#h-scan)" opacity="0.75"/>

  <g opacity="0.72">
