<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Tokyo neon route glow</title>
  <desc id="desc">A sparse Tokyo subway inspired neon route graphic with a local junction and minimal labels.</desc>
  <defs>
    <linearGradient id="m-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#050713"/>
      <stop offset="0.58" stop-color="#0a0d20"/>
      <stop offset="1" stop-color="#041216"/>
    </linearGradient>
    <radialGradient id="m-glow-bg" cx="52%" cy="52%" r="45%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ff2f92" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#050713" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m-hot" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.52" stop-color="#ff2f92"/>
      <stop offset="1" stop-color="#ffe66d"/>
    </linearGradient>
    <filter id="m-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#m-bg)"/>
  <rect width="1200" height="360" fill="url(#m-glow-bg)"/>
  <path d="M72 58H1128V296H72Z" fill="#050916" fill-opacity="0.42" stroke="#7df9ff" stroke-opacity="0.2"/>
  <path d="M72 104H308" stroke="url(#m-hot)" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="850">
    <text x="96" y="90" fill="#ffe66d" font-size="16" letter-spacing="3">NEON ROUTES</text>
    <text x="924" y="90" fill="#7df9ff" font-size="13" letter-spacing="2">PUBLIC WORK</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#m-glow)">
    <path d="M194 146H420C492 146 526 172 560 186" stroke="#ffe66d" stroke-width="3"/>
    <path d="M1006 146H780C708 146 674 172 640 186" stroke="#00e5ff" stroke-width="3"/>
    <path d="M194 248H420C492 248 526 212 560 202" stroke="#ff2f92" stroke-width="3"/>
    <path d="M1006 248H780C708 248 674 212 640 202" stroke="#ff4fb3" stroke-width="3"/>
  </g>

  <g filter="url(#m-glow)">
    <circle cx="600" cy="194" r="58" fill="#07101a" fill-opacity="0.86" stroke="#00e5ff" stroke-width="2.6"/>
    <circle cx="600" cy="194" r="34" fill="#13091d" fill-opacity="0.7" stroke="#ff2f92" stroke-width="2"/>
    <text x="600" y="191" text-anchor="middle" fill="#f4fbff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="900">LOCAL</text>
    <text x="600" y="217" text-anchor="middle" fill="#ffe66d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="900">JCT</text>
  </g>

  <g filter="url(#m-glow)">
    <circle cx="194" cy="146" r="7" fill="#ffe66d"/>
    <circle cx="1006" cy="146" r="7" fill="#00e5ff"/>
    <circle cx="194" cy="248" r="7" fill="#ff2f92"/>
    <circle cx="1006" cy="248" r="7" fill="#ff4fb3"/>
  </g>
</svg>
