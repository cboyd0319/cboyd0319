<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Public project signal map</title>
  <desc id="desc">A synthwave system map showing four public project nodes connected through a local control bus.</desc>
  <defs>
    <linearGradient id="m-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#060713"/>
      <stop offset="0.5" stop-color="#11182b"/>
      <stop offset="1" stop-color="#081015"/>
    </linearGradient>
    <linearGradient id="m-card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d1a2b" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#140b24" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="m-hot" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#ff2f92"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <pattern id="m-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#7df9ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="m-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#m-bg)"/>
  <rect width="1200" height="420" fill="url(#m-grid)"/>
  <path d="M52 50H1148V370H52Z" fill="#070d18" fill-opacity="0.72" stroke="#00e5ff" stroke-opacity="0.5" stroke-width="1.6"/>
  <path d="M52 96H1148" stroke="url(#m-hot)" stroke-width="2.4" opacity="0.86"/>
  <text x="74" y="81" fill="#ffd166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="900" letter-spacing="3">PUBLIC SIGNAL MAP</text>
  <text x="740" y="81" fill="#7df9ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="900" letter-spacing="2">LOCAL CONTROL BUS // PUBLIC OUTPUT</text>

  <g stroke="#7df9ff" stroke-opacity="0.42" stroke-width="2" fill="none">
    <path d="M600 220C504 190 416 165 324 150"/>
    <path d="M600 220C696 190 784 165 876 150"/>
    <path d="M600 220C500 246 416 276 324 304"/>
    <path d="M600 220C700 246 784 276 876 304"/>
  </g>
  <g stroke="#ff2f92" stroke-opacity="0.6" stroke-width="2" fill="none" filter="url(#m-glow)">
    <path d="M600 220C534 200 462 180 386 166"/>
    <path d="M600 220C666 200 738 180 814 166"/>
    <path d="M600 220C534 238 462 264 386 290"/>
    <path d="M600 220C666 238 738 264 814 290"/>
  </g>

  <g filter="url(#m-glow)">
    <path d="M600 143 690 220 600 297 510 220Z" fill="#08111f" stroke="#00e5ff" stroke-width="3"/>
    <path d="M600 170 656 220 600 270 544 220Z" fill="#130c25" stroke="#ff2f92" stroke-width="2"/>
    <text x="600" y="215" text-anchor="middle" fill="#f7fbff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="900">LOCAL</text>
    <text x="600" y="241" text-anchor="middle" fill="#ffd166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="900">CONTROL</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g>
      <path d="M84 120H388L416 148V210H84Z" fill="url(#m-card)" stroke="#ffd166" stroke-opacity="0.82" stroke-width="1.8"/>
      <text x="112" y="154" fill="#f7fbff" font-size="19" font-weight="900">WormsWMD-macOS-Fix</text>
      <text x="112" y="184" fill="#7df9ff" font-size="15" font-weight="750">macOS repair kit</text>
      <path d="M96 198H190" stroke="#ffd166" stroke-width="3"/>
    </g>
    <g>
      <path d="M784 120H1088L1116 148V210H784Z" fill="url(#m-card)" stroke="#00e5ff" stroke-opacity="0.82" stroke-width="1.8"/>
      <text x="812" y="154" fill="#f7fbff" font-size="19" font-weight="900">JobSentinel</text>
      <text x="812" y="184" fill="#7df9ff" font-size="15" font-weight="750">self-hosted job radar</text>
      <path d="M796 198H890" stroke="#00e5ff" stroke-width="3"/>
    </g>
    <g>
      <path d="M84 256H388L416 284V346H84Z" fill="url(#m-card)" stroke="#ff2f92" stroke-opacity="0.82" stroke-width="1.8"/>
      <text x="112" y="290" fill="#f7fbff" font-size="19" font-weight="900">PyGuard</text>
      <text x="112" y="320" fill="#7df9ff" font-size="15" font-weight="750">Python security gate</text>
      <path d="M96 334H190" stroke="#ff2f92" stroke-width="3"/>
    </g>
    <g>
      <path d="M784 256H1088L1116 284V346H784Z" fill="url(#m-card)" stroke="#ff2f92" stroke-opacity="0.82" stroke-width="1.8"/>
      <text x="812" y="290" fill="#f7fbff" font-size="19" font-weight="900">PoshGuard</text>
      <text x="812" y="320" fill="#7df9ff" font-size="15" font-weight="750">PowerShell autofix rig</text>
      <path d="M796 334H890" stroke="#ff2f92" stroke-width="3"/>
    </g>
  </g>
</svg>
