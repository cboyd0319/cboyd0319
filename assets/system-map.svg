<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">CBOYD0319 neon system map</title>
  <desc id="desc">A Tokyo subway inspired neon system map with labeled routes for local tools, API services, security, automation, and agents.</desc>
  <defs>
    <linearGradient id="m-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#050713"/>
      <stop offset="0.58" stop-color="#0a0d20"/>
      <stop offset="1" stop-color="#041216"/>
    </linearGradient>
    <radialGradient id="m-glow-bg" cx="52%" cy="52%" r="45%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ff2f92" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#050713" stop-opacity="0"/>
    </radialGradient>
    <pattern id="m-dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#20375f" stroke-opacity="0.36" stroke-width="1"/>
      <circle cx="2" cy="2" r="1.2" fill="#00e5ff" opacity="0.28"/>
    </pattern>
    <linearGradient id="m-hot" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.52" stop-color="#ff2f92"/>
      <stop offset="1" stop-color="#ffe66d"/>
    </linearGradient>
    <filter id="m-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="430" fill="url(#m-bg)"/>
  <rect width="1200" height="430" fill="url(#m-glow-bg)"/>
  <path d="M36 32H1164V398H36Z" fill="#050916" fill-opacity="0.46" stroke="#7df9ff" stroke-opacity="0.2"/>
  <rect x="72" y="86" width="1056" height="276" fill="url(#m-dot-grid)" opacity="0.86"/>
  <path d="M36 32H332" stroke="url(#m-hot)" stroke-width="2.2"/>
  <path d="M858 398H1164" stroke="url(#m-hot)" stroke-width="2.2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="900">
    <text x="78" y="68" fill="#00e5ff" font-size="24" letter-spacing="4" filter="url(#m-glow)">SYSTEM MAP</text>
    <text x="910" y="68" fill="#31ffb6" font-size="13" letter-spacing="2">TOPOLOGY: ACTIVE</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#m-glow)">
    <path d="M600 214H454L388 152H246" stroke="#ff2f92" stroke-width="7"/>
    <path d="M600 214H744L812 152H954" stroke="#00e5ff" stroke-width="7"/>
    <path d="M600 214H438L356 292H232" stroke="#ffe66d" stroke-width="7"/>
    <path d="M600 214H772L858 292H986" stroke="#a855ff" stroke-width="7"/>
    <path d="M600 214V318" stroke="#22f0d1" stroke-width="7"/>
    <path d="M600 214H454L388 152H246M600 214H744L812 152H954M600 214H438L356 292H232M600 214H772L858 292H986M600 214V318" stroke="#f4fbff" stroke-opacity="0.22" stroke-width="2"/>
  </g>

  <g filter="url(#m-glow)">
    <circle cx="600" cy="214" r="52" fill="#07101a" fill-opacity="0.92" stroke="#f4fbff" stroke-width="3"/>
    <circle cx="600" cy="214" r="31" fill="#13091d" fill-opacity="0.7" stroke="#00e5ff" stroke-width="2"/>
    <path d="M600 188l24 14v28l-24 14-24-14v-28Z" fill="none" stroke="#ff7adf" stroke-width="2.4"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="900" filter="url(#m-glow)">
    <g transform="translate(156 102)">
      <circle cx="62" cy="50" r="43" fill="#101021" fill-opacity="0.9" stroke="#ff2f92" stroke-width="3"/>
      <path d="M42 38H78V62H42ZM50 46l13 8-13 8" fill="none" stroke="#ff7adf" stroke-width="2"/>
      <text x="116" y="42" fill="#ff7adf" font-size="20" letter-spacing="2">LOCAL</text>
      <text x="116" y="70" fill="#ff7adf" font-size="20" letter-spacing="2">TOOLS</text>
    </g>
    <g transform="translate(902 102)">
      <circle cx="62" cy="50" r="43" fill="#07101a" fill-opacity="0.9" stroke="#00e5ff" stroke-width="3"/>
      <path d="M42 58c4-14 18-14 24-7 9-15 30-5 24 12H44c-2 0-3-2-2-5Z" fill="#00e5ff" opacity="0.84"/>
      <text x="116" y="42" fill="#7df9ff" font-size="20" letter-spacing="2">API</text>
      <text x="116" y="70" fill="#7df9ff" font-size="20" letter-spacing="2">SERVICES</text>
    </g>
    <g transform="translate(156 242)">
      <circle cx="62" cy="50" r="43" fill="#15120a" fill-opacity="0.9" stroke="#ffe66d" stroke-width="3"/>
      <path d="M50 48v-8c0-8 24-8 24 0v8M48 48h28v26H48Z" fill="none" stroke="#ffe66d" stroke-width="3"/>
      <text x="20" y="112" fill="#ffe66d" font-size="20" letter-spacing="2">SECURITY</text>
    </g>
    <g transform="translate(902 242)">
      <circle cx="62" cy="50" r="43" fill="#13091d" fill-opacity="0.9" stroke="#a855ff" stroke-width="3"/>
      <path d="M62 26v16M62 58v16M38 50h16M70 50h16M48 36l10 10M76 64l10 10M76 36 66 46M48 74l10-10" stroke="#c77dff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="62" cy="50" r="12" fill="none" stroke="#c77dff" stroke-width="3"/>
      <text x="-18" y="112" fill="#c77dff" font-size="20" letter-spacing="2">AUTOMATION</text>
    </g>
    <g transform="translate(522 286)">
      <circle cx="78" cy="28" r="40" fill="#061916" fill-opacity="0.9" stroke="#22f0d1" stroke-width="3"/>
      <path d="M58 26H98V50H58ZM66 20v-8M90 20v-8M66 36h4M86 36h4" fill="none" stroke="#22f0d1" stroke-width="3" stroke-linecap="round"/>
      <text x="138" y="36" fill="#22f0d1" font-size="20" letter-spacing="2">AGENTS</text>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" filter="url(#m-glow)">
    <path d="M418 366H782V394H418Z" fill="#07101a" fill-opacity="0.72" stroke="#536083" stroke-width="1.5"/>
    <circle cx="454" cy="380" r="7" fill="#31ffb6"/>
    <text x="482" y="386" fill="#c9d7ff" font-size="17" letter-spacing="2">SYSTEM STATUS:</text>
    <text x="690" y="386" fill="#31ffb6" font-size="17" font-weight="900" letter-spacing="2">ONLINE</text>
  </g>
</svg>
